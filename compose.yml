services:

  postgres:
    image: postgres:17-alpine
    container_name: webapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webapp
      POSTGRES_USER: webapp
      POSTGRES_PASSWORD: webapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: webapp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/webapp
      DB_USERNAME: webapp
      DB_PASSWORD: webapp
    ports:
      - "8080:8080"

volumes:
  postgres-data: